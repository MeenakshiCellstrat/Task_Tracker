<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-start p-10 min-h-screen">

  <div class="w-full max-w-md bg-white p-6 shadow rounded">
    <h1 class="text-2xl font-bold text-center mb-4">Task Tracker</h1>

    <div class="flex mb-4 gap-2">
      <input id="taskInput" class="border px-2 flex-1 py-2 rounded" placeholder="Enter task">
      <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded">Add</button>
    </div>

    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
